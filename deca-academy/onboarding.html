<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Woodside DECA · Rookie Onboarding</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef3f9}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="rookie" src="onboarding-core.html" title="Woodside DECA Rookie Onboarding"></iframe>
<script>
const frame=document.getElementById('rookie');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!w.location.pathname.endsWith('/deca-academy/onboarding-core.html')){window.location.href=w.location.href;return}
    const css=d.createElement('link');css.rel='stylesheet';css.href='onboarding-upgrade.css?v=3';d.head.appendChild(css);
    const js=d.createElement('script');js.src='onboarding-upgrade.js?v=3';
    js.onload=()=>{
      const classroom=d.createElement('script');classroom.src='onboarding-classroom.js?v=1';d.body.appendChild(classroom);
    };
    d.body.appendChild(js);
  }catch(err){console.error('DECA onboarding upgrade failed',err)}
});
</script>
</body>
</html>
