<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Woodside DECA · Rookie Onboarding</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef3f9}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="rookie" src="onboarding-core.html" title="Woodside DECA Rookie Onboarding"></iframe>
<script>
const frame=document.getElementById('rookie');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!w.location.pathname.endsWith('/deca-academy/onboarding-core.html')){window.location.href=w.location.href;return}
    const style=d.createElement('style');
    style.textContent='.hero .paperCue{color:#5f4700}.hero .paperCue .checkpointHint{color:#765000}';
    d.head.appendChild(style);
    const patch=d.createElement('script');
    patch.textContent=`saveIdentity=function(){
      let first=document.getElementById('firstName').value.trim();
      let last=document.getElementById('lastInitial').value.trim().toUpperCase();
      let period=document.getElementById('period').value;
      let selected=document.querySelector('[data-q="course"] .choice.sel');
      let course=(selected&&selected.dataset.v)||answers.course||'';
      if(!first){alert('Enter your first name.');return}
      if(last.length!==1){alert('Enter one letter for your last initial.');return}
      if(!period){alert('Choose your class period.');return}
      if(!course){alert('Choose your class.');return}
      answers.course=course;
      let s=readState();
      s.student={firstName:first,lastInitial:last,period,course,teacher:teachers[course]};
      s.cat=course;
      writeState(s);
      go(2)
    }`;
    d.head.appendChild(patch);
  }catch(err){console.error('DECA onboarding patch failed',err)}
});
</script>
</body>
</html>
