<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Woodside DECA · Advisor Dashboard</title>
<style>html,body{margin:0;width:100%;height:100%;background:#eef3f9}body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#52657e}iframe{display:none;width:100%;height:100vh;border:0}</style>
</head>
<body>
<div class="loading" id="loading">Checking advisor access…</div>
<iframe id="dash" title="Woodside DECA Advisor Dashboard"></iframe>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
<script>
(async()=>{
  const db=window.supabase.createClient('https://dtlyxqjkkuxltixokono.supabase.co','sb_publishable_kK8trUbOxWVfIltC0t-apA_XXbrC7cC');
  const {data:{session}}=await db.auth.getSession();
  if(!session){location.replace('teacher.html');return}
  const {data:admin,error}=await db.from('teacher_admins').select('email').maybeSingle();
  if(error||!admin){await db.auth.signOut();location.replace('teacher.html');return}
  const frame=document.getElementById('dash');
  frame.src='advisor-dashboard-core.html';
  frame.style.display='block';
  document.getElementById('loading').style.display='none';
})();
</script>
</body>
</html>
