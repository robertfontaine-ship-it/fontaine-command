<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Woodside DECA · Partner Mission</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef3f9}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="partner" src="partner-mission-core.html" title="Woodside DECA Partner Mission"></iframe>
<script>
const frame=document.getElementById('partner');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!w.location.pathname.endsWith('/deca-academy/partner-mission-core.html')){window.location.href=w.location.href;return}
    const js=d.createElement('script');js.src='partner-mission-upgrade.js?v=1';d.body.appendChild(js);
  }catch(err){console.error('DECA partner mission upgrade failed',err)}
});
</script>
</body>
</html>
