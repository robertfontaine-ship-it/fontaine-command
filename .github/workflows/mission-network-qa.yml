name: Mission Network QA

on:
  pull_request:
    paths:
      - 'business-world.*'
      - 'mission-*'
      - 'student-mission-id.*'
      - 'student-review-packet.js'
      - 'topic-hubs*'
      - 'branding-hub.html'
      - 'target-market-hub.*'
      - 'four-ps-hub.*'
      - 'marketing-functions-hub.*'
      - 'promotional-mix-hub.*'
      - 'wolverine-agency.*'
      - 'agency-project-*'
      - 'index.html'
      - 'tests/mission-*.test.cjs'
      - 'tests/agency-*.test.cjs'
      - '.github/workflows/mission-network-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mission-network-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Mission Network data and accessibility checks
        run: node --test tests/mission-network.test.cjs tests/mission-network-accessibility.test.cjs tests/agency-project-launcher.test.cjs

      - name: Install Playwright
        run: |
          npm install --no-save --silent playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Run Mission Network browser checks
        run: |
          node tests/mission-network-browser.test.cjs
          node tests/mission-network-accessibility-browser.test.cjs
          node tests/mission-review-workflow-browser.test.cjs
          node tests/agency-team-workflow-browser.test.cjs
