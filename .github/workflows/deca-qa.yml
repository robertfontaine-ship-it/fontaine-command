name: DECA Page QA

on:
  push:
    paths:
      - 'deca-academy/**'
      - '.github/workflows/deca-qa.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check standalone JavaScript
        run: |
          node --check deca-academy/onboarding-upgrade.js
          node --check deca-academy/partner-mission-upgrade.js
      - name: Check inline page scripts
        run: |
          python3 - <<'PY'
          import re, subprocess, pathlib, sys
          pages = [
              'deca-academy/onboarding.html',
              'deca-academy/onboarding-core.html',
              'deca-academy/partner-mission.html',
              'deca-academy/partner-mission-core.html',
              'deca-academy/teacher.html',
              'deca-academy/advisor-dashboard.html',
              'deca-academy/advisor-dashboard-core.html',
          ]
          failures=[]
          out=pathlib.Path('/tmp/deca-inline')
          out.mkdir(exist_ok=True)
          for page in pages:
              text=pathlib.Path(page).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
              for i,script in enumerate(scripts):
                  if not script.strip():
                      continue
                  p=out/(pathlib.Path(page).stem+f'-{i}.js')
                  p.write_text(script, encoding='utf-8')
                  r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
                  if r.returncode:
                      failures.append(f'{page} script {i}: {r.stderr}')
          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print('All inline scripts passed syntax checks.')
          PY
      - name: Check DECA access and partner safeguards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          teacher=Path('deca-academy/teacher.html').read_text()
          dash=Path('deca-academy/advisor-dashboard.html').read_text()
          partner=Path('deca-academy/partner-mission-upgrade.js').read_text()
          onboard=Path('deca-academy/onboarding-upgrade.js').read_text()
          checks={
            'teacher uses DECA-specific setup':'deca-advisor-auth' in teacher,
            'public dashboard has no magic-link UI':'sign-in link' not in dash.lower() and 'signInWithOtp' not in dash,
            'partner pair code present':'PAIR CODE' in partner,
            'partner scenario is deterministic':'hashText' in partner and 'seed%bank.length' in partner,
            'partner roles deterministic':'meAudience' in partner,
            'onboarding normal-words event cards':'IN NORMAL WORDS' in onboard,
            'onboarding avoids value proposition':'value proposition' not in onboard.lower(),
          }
          failed=[name for name,ok in checks.items() if not ok]
          for name,ok in checks.items(): print(('PASS ' if ok else 'FAIL ')+name)
          if failed: raise SystemExit('QA failures: '+', '.join(failed))
          PY
